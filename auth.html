<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar - Pusdatin Kwarcab Wonogiri</title>
    
    <!-- Tailwind CSS (Abaikan warning di console) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Library Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 fade-in">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Pusdatin Kwarcab Wonogiri</h1>
            <p class="text-gray-500 text-sm mt-1">Portal Informasi & Laporan Kegiatan</p>
        </div>

        <div class="flex mb-6 bg-gray-100 p-1 rounded-lg">
            <button id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-md bg-white shadow text-emerald-600 transition">Login</button>
            <button id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition">Daftar Akun</button>
        </div>

        <div id="message-box" class="hidden mb-4 p-3 rounded-md text-sm"></div>

        <!-- FORM LOGIN -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-md hover:bg-emerald-700 font-medium transition flex justify-center items-center">
                <span id="login-btn-text">Masuk</span>
                <svg id="login-spinner" class="hidden w-5 h-5 ml-2 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>

        <!-- FORM REGISTER -->
        <form id="form-register" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                <input type="text" id="reg-name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">No. WhatsApp</label>
                <input type="text" id="reg-phone" required placeholder="08123456789" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="reg-email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="reg-password" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Asal Organisasi</label>
                <select id="reg-org" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                    <option value="">Memuat data organisasi...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Role yang Diajukan</label>
                <select id="reg-role" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                    <option value="admin_kwaran">Admin Kwaran</option>
                    <option value="admin_bidang">Admin Bidang</option>
                    <option value="contributor">Kontributor / Reporter</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-md hover:bg-emerald-700 font-medium transition flex justify-center items-center">
                <span id="reg-btn-text">Daftar Sekarang</span>
                <svg id="reg-spinner" class="hidden w-5 h-5 ml-2 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>
    </div>

    <!-- LOGIC JAVASCRIPT (SUDAH DIPERBAIKI) -->
    <script>
        // 1. KONFIGURASI SUPABASE
        // GANTI DENGAN URL DAN ANON KEY DARI DASHBOARD SUPABASE ANDA
        const SUPABASE_URL = 'https://lrztwtolcgsxexudhhqh.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyenR3dG9sY2dzeGV4dWRoaHFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNjM5MjAsImV4cCI6MjExMDgzOTkyMH0.TyhQu4Ruw5n0NEEs84JabtqjCRBfB97kFxiEP7dfek4';
        
        // PERBAIKAN: Gunakan nama variabel 'db' agar tidak bentrok dengan library aslinya
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. VARIABEL DOM
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const msgBox = document.getElementById('message-box');

        // 3. FUNGSI BANTU (UI)
        function showMsg(text, type = 'error') {
            msgBox.textContent = text;
            msgBox.className = type === 'error' 
                ? 'mb-4 p-3 rounded-md text-sm bg-red-100 text-red-700 border border-red-200' 
                : 'mb-4 p-3 rounded-md text-sm bg-green-100 text-green-700 border border-green-200';
            msgBox.classList.remove('hidden');
        }

        function hideMsg() {
            msgBox.classList.add('hidden');
        }

        function setLoading(isLoading, formType) {
            const spinner = document.getElementById(`${formType}-spinner`);
            const btn = document.querySelector(`#form-${formType} button[type="submit"]`);
            
            if (isLoading) {
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                spinner.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
            }
        }

        // 4. PINDAH TAB
        tabLogin.addEventListener('click', () => {
            formLogin.classList.remove('hidden');
            formRegister.classList.add('hidden');
            tabLogin.classList.add('bg-white', 'shadow', 'text-emerald-600');
            tabLogin.classList.remove('text-gray-500');
            tabRegister.classList.remove('bg-white', 'shadow', 'text-emerald-600');
            tabRegister.classList.add('text-gray-500');
            hideMsg();
        });

        tabRegister.addEventListener('click', () => {
            formRegister.classList.remove('hidden');
            formLogin.classList.add('hidden');
            tabRegister.classList.add('bg-white', 'shadow', 'text-emerald-600');
            tabRegister.classList.remove('text-gray-500');
            tabLogin.classList.remove('bg-white', 'shadow', 'text-emerald-600');
            tabLogin.classList.add('text-gray-500');
            hideMsg();
        });

        // 5. LOAD DATA ORGANISASI
        async function loadOrganizations() {
            // PERBAIKAN: Ganti 'supabase' menjadi 'db'
            const { data, error } = await db
                .from('organizations')
                .select('id, name, type')
                .eq('is_active', true)
                .in('type', ['kwaran', 'bidang'])
                .order('name');

            const selectOrg = document.getElementById('reg-org');
            selectOrg.innerHTML = '<option value="">Pilih Organisasi...</option>';

            if (data) {
                data.forEach(org => {
                    const opt = document.createElement('option');
                    opt.value = org.id;
                    opt.textContent = `${org.name} (${org.type.toUpperCase()})`;
                    selectOrg.appendChild(opt);
                });
            } else {
                selectOrg.innerHTML = '<option value="">Gagal memuat organisasi</option>';
                console.error("Error load org:", error);
            }
        }

        // 6. PROSES LOGIN
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsg();
            setLoading(true, 'login');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // PERBAIKAN: Ganti 'supabase' menjadi 'db'
            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                showMsg(error.message);
            } else {
                const { data: profile } = await db
                    .from('profiles')
                    .select('status, role')
                    .eq('id', data.user.id)
                    .single();

                if (profile && profile.status === 'active') {
                    showMsg('Login berhasil! Mengalihkan ke dashboard...', 'success');
                    setTimeout(() => { window.location.href = 'admin/index.html'; }, 1500);
                } else if (profile && profile.status === 'pending') {
                    showMsg('Akun Anda masih menunggu persetujuan Admin Kwarcab.', 'error');
                } else {
                    showMsg('Akun belum terdaftar atau profil belum dibuat.', 'error');
                }
            }
            setLoading(false, 'login');
        });

        // 7. PROSES REGISTER
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsg();
            setLoading(true, 'reg');

            const fullName = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const orgId = document.getElementById('reg-org').value;
            const role = document.getElementById('reg-role').value;

            if (!orgId) {
                showMsg('Silakan pilih organisasi.');
                setLoading(false, 'reg');
                return;
            }

            // PERBAIKAN: Ganti 'supabase' menjadi 'db'
            const { data: authData, error: authError } = await db.auth.signUp({ email, password });

            if (authError) {
                showMsg(authError.message);
                setLoading(false, 'reg');
                return;
            }

            const { error: dbError } = await db
                .from('account_registrations')
                .insert([{
                    user_id: authData.user.id,
                    full_name: fullName,
                    phone: phone,
                    organization_id: orgId,
                    requested_role: role,
                    status: 'pending'
                }]);

            if (dbError) {
                showMsg('Gagal menyimpan data pendaftaran: ' + dbError.message);
                console.error(dbError);
            } else {
                showMsg('Pendaftaran berhasil! Akun Anda sedang menunggu persetujuan Admin Kwarcab.', 'success');
                formRegister.reset();
                setTimeout(() => tabLogin.click(), 2000);
            }
            
            setLoading(false, 'reg');
        });

        // Panggil fungsi load organisasi saat halaman siap
        window.addEventListener('DOMContentLoaded', loadOrganizations);
    </script>
</body>
</html>
