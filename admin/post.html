<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Konten - Pusdatin Kwarcab Wonogiri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="data:,">
    <style>
        .sidebar-link.active { background-color: #059669; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto"></div>
            <p class="mt-4 text-gray-600">Memuat halaman...</p>
        </div>
    </div>

    <div id="app-container" class="hidden flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-emerald-900 text-white flex flex-col">
            <div class="p-4 border-b border-emerald-800">
                <h1 class="text-lg font-bold">Pusdatin Kwarcab</h1>
                <p class="text-xs text-emerald-300">Dashboard Admin</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="index.html" class="sidebar-link flex items-center px-4 py-2 rounded-lg hover:bg-emerald-800 transition">
                    <span>📊 Dashboard</span>
                </a>
                <a href="approval.html" class="sidebar-link flex items-center px-4 py-2 rounded-lg hover:bg-emerald-800 transition">
                    <span>✅ Approval Akun</span>
                </a>
                <a href="post-list.html" class="sidebar-link flex items-center px-4 py-2 rounded-lg hover:bg-emerald-800 transition">
                    <span>📰 Kelola Konten</span>
                </a>
                <a href="post.html" class="sidebar-link active flex items-center px-4 py-2 rounded-lg hover:bg-emerald-800 transition">
                    <span>➕ Buat Konten Baru</span>
                </a>
                <a href="surat.html" class="sidebar-link flex items-center px-4 py-2 rounded-lg hover:bg-emerald-800 transition">
                    <span>📄 Surat Menyurat</span>
                </a>
                <a href="organizations.html" class="sidebar-link flex items-center px-4 py-2 rounded-lg hover:bg-emerald-800 transition">
                    <span>🏢 Organisasi</span>
                </a>
            </nav>
            <div class="p-4 border-t border-emerald-800">
                <p id="user-name" class="text-sm font-medium">Loading...</p>
                <p id="user-role" class="text-xs text-emerald-300">-</p>
                <button onclick="logout()" class="mt-3 w-full bg-emerald-700 hover:bg-emerald-600 text-white py-2 rounded-lg text-sm transition">
                    🚪 Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-800">➕ Buat Konten Baru</h2>
                <p class="text-gray-500">Buat berita, pengumuman, atau laporan kegiatan</p>
            </div>

            <div class="max-w-4xl">
                <form id="post-form" class="bg-white rounded-xl shadow-md p-6 space-y-6">
                    <!-- Tipe Konten -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipe Konten *</label>
                        <select id="post-type" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="berita">Berita</option>
                            <option value="pengumuman">Pengumuman</option>
                            <option value="laporan">Laporan Kegiatan</option>
                        </select>
                    </div>

                    <!-- Judul -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Judul *</label>
                        <input type="text" id="post-title" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Masukkan judul konten...">
                    </div>

                    <!-- Organisasi -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Organisasi *</label>
                        <select id="post-org" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">Pilih Organisasi...</option>
                        </select>
                    </div>

                    <!-- Kategori -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                        <select id="post-category" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">Pilih Kategori (Opsional)...</option>
                        </select>
                    </div>

                    <!-- Ringkasan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ringkasan / Excerpt</label>
                        <textarea id="post-excerpt" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Ringkasan singkat yang muncul di daftar berita..."></textarea>
                    </div>

                    <!-- Isi Konten -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Isi Konten *</label>
                        <textarea id="post-content" rows="10" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Tulis isi konten di sini..."></textarea>
                    </div>

                    <!-- Tanggal & Lokasi Kegiatan -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Kegiatan</label>
                            <input type="date" id="post-event-date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Kegiatan</label>
                            <input type="text" id="post-location" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Contoh: Aula Kwarcab Wonogiri">
                        </div>
                    </div>

                    <!-- Cover URL -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cover Image URL (Opsional)</label>
                        <input type="url" id="post-cover" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="https://example.com/image.jpg">
                        <p class="text-xs text-gray-400 mt-1">Tempel link gambar dari Google Drive, Imgur, atau sumber lainnya.</p>
                    </div>

                    <!-- Link Dokumentasi -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Link Dokumentasi (Opsional)</label>
                        <div id="links-container" class="space-y-3">
                            <!-- Links akan ditambahkan di sini -->
                        </div>
                        <button type="button" onclick="addLinkField()" class="mt-2 px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-md text-sm hover:bg-emerald-200 transition">
                            + Tambah Link
                        </button>
                    </div>

                    <!-- Buttons -->
                    <div class="flex space-x-4 pt-4 border-t">
                        <button type="button" onclick="saveDraft()" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition font-medium">
                            💾 Simpan Draft
                        </button>
                        <button type="submit" class="flex-1 px-4 py-3 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition font-medium">
                            📤 Submit untuk Review
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // ==================== KONFIGURASI SUPABASE ====================
        const SUPABASE_URL = 'GANTI_DENGAN_URL_SUPABASE_ANDA';
        const SUPABASE_ANON_KEY = 'GANTI_DENGAN_ANON_KEY_ANDA';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let linkCount = 0;

        // ==================== CEK AUTENTIKASI ====================
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            
            if (!session) {
                window.location.href = '../auth.html';
                return;
            }

            currentUser = session.user;

            const { data: profile, error } = await db
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error || !profile || profile.status !== 'active') {
                alert('Akun Anda belum aktif atau tidak ditemukan.');
                await db.auth.signOut();
                window.location.href = '../auth.html';
                return;
            }

            currentProfile = profile;
            document.getElementById('user-name').textContent = profile.full_name;
            document.getElementById('user-role').textContent = formatRole(profile.role);

            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            await loadOrganizations();
            await loadCategories();
            addLinkField(); // Tambah satu field link default
        }

        // ==================== MUAT DATA ORGANISASI ====================
        async function loadOrganizations() {
            const { data, error } = await db
                .from('organizations')
                .select('id, name, type')
                .eq('is_active', true)
                .order('name');

            if (error) {
                console.error('Error loading organizations:', error);
                return;
            }

            const select = document.getElementById('post-org');
            select.innerHTML = '<option value="">Pilih Organisasi...</option>';
            
            data.forEach(org => {
                const opt = document.createElement('option');
                opt.value = org.id;
                opt.textContent = `${org.name} (${org.type.toUpperCase()})`;
                select.appendChild(opt);
            });

            // Jika user bukan admin kwarcab, set otomatis ke organisasinya
            if (!['super_admin', 'admin_kwarcab'].includes(currentProfile.role)) {
                select.value = currentProfile.organization_id;
                select.disabled = true;
            }
        }

        // ==================== MUAT DATA KATEGORI ====================
        async function loadCategories() {
            const { data, error } = await db
                .from('categories')
                .select('id, name')
                .eq('is_active', true)
                .order('name');

            if (error) {
                console.error('Error loading categories:', error);
                return;
            }

            const select = document.getElementById('post-category');
            select.innerHTML = '<option value="">Pilih Kategori (Opsional)...</option>';
            
            data.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        // ==================== LINK DOKUMENTASI ====================
        function addLinkField() {
            linkCount++;
            const container = document.getElementById('links-container');
            const div = document.createElement('div');
            div.className = 'link-field flex items-center space-x-2';
            div.innerHTML = `
                <input type="text" class="link-label flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Label (contoh: Foto Kegiatan)">
                <input type="url" class="link-url flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="https://...">
                <select class="link-type px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="foto">Foto</option>
                    <option value="video">Video</option>
                    <option value="dokumen">Dokumen</option>
                    <option value="sosial">Media Sosial</option>
                    <option value="lainnya">Lainnya</option>
                </select>
                <button type="button" onclick="removeLinkField(this)" class="px-3 py-2 bg-red-100 text-red-600 rounded-md hover:bg-red-200 transition">
                    ✕
                </button>
            `;
            container.appendChild(div);
        }

        function removeLinkField(btn) {
            btn.parentElement.remove();
        }

        function getLinks() {
            const links = [];
            document.querySelectorAll('.link-field').forEach((field, index) => {
                const label = field.querySelector('.link-label').value.trim();
                const url = field.querySelector('.link-url').value.trim();
                const type = field.querySelector('.link-type').value;
                
                if (label && url) {
                    links.push({
                        label: label,
                        url: url,
                        link_type: type,
                        sort_order: index
                    });
                }
            });
            return links;
        }

        // ==================== SIMPAN KONTEN ====================
        async function savePost(status) {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const orgId = document.getElementById('post-org').value;

            if (!title || !content || !orgId) {
                alert('Mohon isi Judul, Isi Konten, dan Organisasi.');
                return;
            }

            const postData = {
                post_type: document.getElementById('post-type').value,
                title: title,
                slug: generateSlug(title),
                excerpt: document.getElementById('post-excerpt').value.trim() || null,
                content: content,
                organization_id: orgId,
                category_id: document.getElementById('post-category').value || null,
                author_id: currentUser.id,
                status: status,
                cover_url: document.getElementById('post-cover').value.trim() || null,
                event_date: document.getElementById('post-event-date').value || null,
                location: document.getElementById('post-location').value.trim() || null,
                published_at: status === 'published' ? new Date().toISOString() : null
            };

            try {
                // Insert post
                const { data: post, error: postError } = await db
                    .from('posts')
                    .insert([postData])
                    .select()
                    .single();

                if (postError) throw postError;

                // Insert links
                const links = getLinks();
                if (links.length > 0) {
                    const linksWithPostId = links.map(link => ({
                        ...link,
                        post_id: post.id
                    }));

                    const { error: linksError } = await db
                        .from('post_links')
                        .insert(linksWithPostId);

                    if (linksError) throw linksError;
                }

                if (status === 'draft') {
                    alert('✅ Draft berhasil disimpan!');
                } else {
                    alert('✅ Konten berhasil disubmit untuk review!');
                }

                // Reset form
                document.getElementById('post-form').reset();
                document.getElementById('links-container').innerHTML = '';
                addLinkField();

            } catch (error) {
                console.error('Error saving post:', error);
                alert('❌ Gagal menyimpan konten: ' + error.message);
            }
        }

        async function saveDraft() {
            await savePost('draft');
        }

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await savePost('submitted');
        });

        // ==================== HELPER FUNCTIONS ====================
        function generateSlug(title) {
            return title
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .trim();
        }

        function formatRole(role) {
            const roles = {
                'super_admin': 'Super Admin',
                'admin_kwarcab': 'Admin Kwarcab',
                'admin_bidang': 'Admin Bidang',
                'admin_kwaran': 'Admin Kwaran',
                'contributor': 'Kontributor'
            };
            return roles[role] || role;
        }

        async function logout() {
            if (confirm('Yakin ingin logout?')) {
                await db.auth.signOut();
                window.location.href = '../auth.html';
            }
        }

        // ==================== INISIALISASI ====================
        window.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
